      {
        id: 5,
        category: "grinders",
        name: "مطحنة iCafilas اليدوية الاحترافية (Manual Coffee Grinder)",
        price: 4500, // سعر افتراضي يمكنك تعديله
        image: "https://i.postimg.cc/5NvScSTb/ABUIABACGAAg157sm-AYorq-Sm3w-Mw7g-U47g-U.jpg", // استبدلها برابط بوست إيمدج لاحقاً
        images: [
          "https://i.postimg.cc/vBNcTCgg/ABUIABACGAAg18rmm-AYo0r-HKzw-Yw6Ac47Qw.jpg",
          "https://i.postimg.cc/W33d2s40/ABUIABACGAAg18rmm-AYogp7A-Qcw6Ac47gw.jpg",
          "https://i.postimg.cc/FRB7zwf2/ABUIABACGAAg18rmm-AYo8Kf-P6AMw6Ac47gw.jpg",
          "https://i.postimg.cc/FRB7zwf2/ABUIABACGAAg18rmm-AYo8Kf-P6AMw6Ac47gw.jpg",          "https://i.postimg.cc/W33d2s40/ABUIABACGAAg18rmm-AYogp7A-Qcw6Ac47gw.jpg",       "https://i.postimg.cc/W33d2s40/ABUIABACGAAg18rmm-AYogp7A-Qcw6Ac47gw.jpg",         "https://i.postimg.cc/y843FqfW/ABUIABACGAAg18rmm-AYo8-D7AEw6Ac47gw.jpg",        "https://i.postimg.cc/vBNcTCgg/ABUIABACGAAg18rmm-AYo0r-HKzw-Yw6Ac47Qw.jpg",          "https://i.postimg.cc/FRB7zwf2/ABUIABACGAAg18rmm-AYo8Kf-P6AMw6Ac47gw.jpg",       "https://i.postimg.cc/W33d2s40/ABUIABACGAAg18rmm-AYogp7A-Qcw6Ac47gw.jpg", 
"https://i.postimg.cc/y843FqfW/ABUIABACGAAg18rmm-AYo8-D7AEw6Ac47gw.jpg", 
"https://i.postimg.cc/MGsy0PfS/ABUIABACGAAg857sm-AYo7o-GRxw-Mw6Ac46Ac.jpg", 
"https://i.postimg.cc/66Ff1mHS/ABUIABACGAAg2crmm-AYov-LWjvg-Yw6Ac42Aw.jpg", 
"https://i.postimg.cc/YSX1NnGN/ABUIABACGAAg857sm-AYo-M-5m-QUw6Ac46Ac.jpg", 
"https://i.postimg.cc/xTH3r3hm/ABUIABACGAAg857sm-AYops-GOvg-Qw6Ac46Ac.jpg" 
        ],
        desc: "مطحنة قهوة يدوية احترافية بتصميم هندسي مريح[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span)، توفر طحناً دقيقاً ومتجانساً للحصول على أفضل استخلاص للقهوة سواء للإسبريسو أو التقطير[span_16](start_span)[span_16](end_span)[span_17](start_span)[span_17](end_span).",
        specs: {
          "الترس الداخلي": "ستانلس ستيل 420 (CNC) عالي الدقة لضمان طحن متجانس[span_18](start_span)[span_18](end_span)[span_19](start_span)[span_19](end_span)",
          "الهيكل الخارجي": "سبيكة ألمنيوم متينة وعالية الجودة (Aluminum Alloy Shell)[span_20](start_span)[span_20](end_span)[span_21](start_span)[span_21](end_span)[span_22](start_span)[span_22](end_span)",
          "المقبض": "مقبض موفر للجهد مع قبضة من الخشب الصلب (Solid wood grip)[span_23](start_span)[span_23](end_span)[span_24](start_span)[span_24](end_span)[span_25](start_span)[span_25](end_span)",
          "نظام الدوران": "مزودة برمان بلي (Ball Bearings) لدوران سلس وسهل جداً أثناء الطحن[span_26](start_span)[span_26](end_span)[span_27](start_span)[span_27](end_span)",
          "سعة حاوية البن": "تتسع لـ 30 جرام من حبوب القهوة[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span)[span_30](start_span)[span_30](end_span)",
          "ضبط الطحن": "قرص خارجي سهل الضبط مع درجات تناسب الإسبريسو (10-14) والتقطير (18-24)[span_31](start_span)[span_31](end_span)[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span)",
          "منع الانزلاق": "طوق سيليكون خارجي لتوفير قبضة محكمة ومريحة (Silicone anti-skid collar)[span_34](start_span)[span_34](end_span)[span_35](start_span)[span_35](end_span)[span_36](start_span)[span_36](end_span)",
          "الوزن والأبعاد": "وزن 625 جرام - الطول 188 مم × القطر 55 مم[span_37](start_span)[span_37](end_span)"
        }
      }
    ];

    let cart = [];
    let currentSlideIndex = 0;
    let currentModalImages = [];

    function renderCategories() {
      const container = document.getElementById("categories-container");
      container.innerHTML = categories.map(c => {
        const isActive = currentCategory === c.id;
        return `
          <div onclick="setCategory('${c.id}')" class="flex flex-col items-center gap-1.5 cursor-pointer flex-shrink-0 group">
            <div class="w-16 h-16 sm:w-18 sm:h-18 rounded-full p-[2px] transition-all duration-300 ${
              isActive 
                ? 'bg-gradient-to-tr from-amber-600 via-amber-400 to-amber-500 ring-2 ring-amber-500/50 scale-105' 
                : 'bg-white/10 hover:bg-white/20'
            }">
              <div class="w-full h-full rounded-full overflow-hidden bg-stone-900 border-2 border-[#0f0f10]">
                <img src="${c.img}" alt="${c.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300">
              </div>
            </div>
            <span class="text-[11px] font-medium transition-colors whitespace-nowrap ${
              isActive ? 'text-amber-400 font-bold' : 'text-stone-400 group-hover:text-stone-200'
            }">
              ${c.name}
            </span>
          </div>
        `;
      }).join('');
    }

    function setCategory(catId) {
      currentCategory = catId;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById("products-grid");
      const filtered = currentCategory === "all" ? products : products.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-stone-500 text-xs">لا توجد منتجات متاحة في هذا القسم حالياً.</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="glass-card rounded-xl overflow-hidden flex flex-col justify-between hover:border-amber-500/40 transition duration-300">
          <div onclick="openProductModal(${p.id})" class="cursor-pointer">
            <div class="h-44 sm:h-52 w-full overflow-hidden bg-white flex items-center justify-center p-2">
              <img src="${p.image}" alt="${p.name}" class="h-full w-full object-contain hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&q=80'">
            </div>
            <div class="p-2.5 sm:p-3">
              <h3 class="font-bold text-xs sm:text-sm text-stone-100 line-clamp-1 leading-snug">${p.name}</h3>
              <p class="text-[11px] text-stone-400 mt-1 line-clamp-1">${p.desc}</p>
            </div>
          </div>
          <div class="p-2.5 sm:p-3 pt-0 flex items-center justify-between mt-1 border-t border-white/5">
            <span class="font-black text-amber-400 text-xs sm:text-sm">${p.price} <span class="text-[10px] font-normal text-stone-400">ج.م</span></span>
            <button onclick="addToCart(${p.id})" class="bg-amber-600/90 hover:bg-amber-500 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg transition">
              + أضف
            </button>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(id, updateUrl = true) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;

      currentModalImages = prod.images && prod.images.length > 0 ? prod.images : [prod.image];
      currentSlideIndex = 0;
      updateCarousel();

      document.getElementById("modal-product-title").textContent = prod.name;
      document.getElementById("modal-product-price").textContent = `${prod.price} ج.م`;
      document.getElementById("modal-product-desc").textContent = prod.desc;

      const specsBox = document.getElementById("modal-product-specs");
      specsBox.innerHTML = Object.entries(prod.specs).map(([key, value]) => `
        <div class="flex justify-between px-3 py-2">
          <span class="text-stone-400">${key}</span>
          <span class="font-semibold text-stone-200">${value}</span>
        </div>
      `).join('');

      const addBtn = document.getElementById("modal-add-btn");
      addBtn.onclick = () => {
        addToCart(prod.id);
        closeProductModal();
      };

      document.getElementById("product-modal").classList.remove("hidden");

      if (updateUrl) {
        const newUrl = `${window.location.pathname}?product=${prod.id}`;
        window.history.pushState({ productId: prod.id }, "", newUrl);
      }
    }

    function updateCarousel() {
      const imgElem = document.getElementById("carousel-img");
      imgElem.src = currentModalImages[currentSlideIndex];

      const dotsElem = document.getElementById("carousel-dots");
      dotsElem.innerHTML = currentModalImages.map((_, idx) => `
        <span onclick="setSlide(${idx})" class="w-2 h-2 rounded-full cursor-pointer transition-all duration-300 ${
          idx === currentSlideIndex ? 'bg-amber-500 w-4' : 'bg-white/40'
        }"></span>
      `).join('');
    }

    function nextSlide() {
      currentSlideIndex = (currentSlideIndex + 1) % currentModalImages.length;
      updateCarousel();
    }

    function prevSlide() {
      currentSlideIndex = (currentSlideIndex - 1 + currentModalImages.length) % currentModalImages.length;
      updateCarousel();
    }

    function setSlide(idx) {
      currentSlideIndex = idx;
      updateCarousel();
    }

    // إعدادات السحب (Touch & Mouse Swipe Logic)
    let startX = 0;
    let isDragging = false;
    const carouselBox = document.getElementById("carousel-box");

    // أحداث اللمس على الموبايل
    carouselBox.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    carouselBox.addEventListener("touchend", (e) => {
      const diffX = e.changedTouches[0].clientX - startX;
      if (Math.abs(diffX) > 40) {
        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, { passive: true });

    // أحداث الماوس على أجهزة الكمبيوتر
    carouselBox.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX;
    });

    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      const diffX = e.clientX - startX;
      if (Math.abs(diffX) > 40) {
        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    });

    function closeProductModal() {
      document.getElementById("product-modal").classList.add("hidden");
      window.history.pushState({}, "", window.location.pathname);
    }

    function checkUrlForProduct() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get("product"));
      if (productId) openProductModal(productId, false);
    }

    // إدارة السلة
    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty++;
      } else {
        const prod = products.find(p => p.id === id);
        if (prod) cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
    }

    function increaseQty(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty++;
        updateCartUI();
      }
    }

    function decreaseQty(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty--;
        if (item.qty <= 0) {
          removeFromCart(id);
        } else {
          updateCartUI();
        }
      }
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById("cart-badge").textContent = cart.reduce((s, i) => s + i.qty, 0);
      const itemsBox = document.getElementById("cart-items");
      
      if (!cart.length) {
        itemsBox.innerHTML = '<p class="text-center text-stone-500 py-6 text-xs">السلة فارغة حالياً.</p>';
        document.getElementById("cart-total").textContent = "0 ج.م";
        return;
      }

      let total = 0;
      itemsBox.innerHTML = cart.map(i => {
        const subtotal = i.price * i.qty;
        total += subtotal;
        return `
          <div class="flex items-center justify-between py-3 gap-2">
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-stone-200 text-xs truncate">${i.name}</p>
              <p class="text-stone-500 text-[10px] mt-0.5">${i.price} ج.م للقطعة</p>
            </div>

            <div class="flex items-center gap-1.5 bg-black/50 px-2 py-1 rounded-lg border border-white/5">
              <button onclick="decreaseQty(${i.id})" class="w-5 h-5 flex items-center justify-center rounded bg-white/10 hover:bg-amber-600 text-white font-bold text-xs transition">
                -
              </button>
              <span class="text-xs font-bold text-stone-200 px-1.5">${i.qty}</span>
              <button onclick="increaseQty(${i.id})" class="w-5 h-5 flex items-center justify-center rounded bg-white/10 hover:bg-amber-600 text-white font-bold text-xs transition">
                +
              </button>
            </div>

            <div class="flex items-center gap-2">
              <span class="font-bold text-amber-400 text-xs whitespace-nowrap">${subtotal} ج.م</span>
              <button onclick="removeFromCart(${i.id})" title="حذف" class="text-stone-500 hover:text-red-400 p-1 transition">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById("cart-total").textContent = `${total} ج.م`;
    }

    function toggleCart() {
      document.getElementById("cart-modal").classList.toggle("hidden");
    }

    function sendOrderToWhatsApp() {
      if (!cart.length) return alert("السلة فارغة، من فضلك أضف منتجات أولاً!");
      
      const name = document.getElementById("cust-name").value.trim();
      const phone = document.getElementById("cust-phone").value.trim();
      const address = document.getElementById("cust-address").value.trim();

      if (!name || !phone || !address) return alert("يرجى كتابة الاسم ورقم الهاتف والعنوان بالتفصيل.");

      let total = 0;
      let list = "";
      cart.forEach((i, idx) => {
        const subtotal = i.price * i.qty;
        total += subtotal;
        list += `${idx + 1}. ${i.name} (عدد: ${i.qty}) = ${subtotal} ج.م\n`;
      });

      const msg = `طلب جديد من موقع كافينتي (Caffinity) ☕\n\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n\nالطلبات:\n${list}\nالإجمالي: ${total} ج.م (+ مصاريف الشحن)`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    renderCategories();
    renderProducts();
    checkUrlForProduct();
  </script>
</body>
