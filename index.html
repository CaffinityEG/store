<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caffinity | متجر معدات القهوة الاحترافية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b22;
      --accent: #c4975e;
      --accent-hover: #b08249;
      --text: #f0f2f5;
      --text-muted: #9aa0a6;
      --border: #282c37;
      --whatsapp: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(180deg, #181b22 0%, #0f1115 100%);
      padding: 40px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 2.4rem;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 800;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .product-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      background: #20242e;
    }

    .product-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .category-badge {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .product-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .btn-buy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--whatsapp);
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn-buy:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>CAFFINITY STORE ☕</h1>
    <p>بوابتك لعالم استخلاص القهوة الاحترافي</p>
  </header>

  <div class="container">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all')">الكل</button>
      <button class="filter-btn" onclick="filterProducts('machines')">ماكينات القهوة</button>
      <button class="filter-btn" onclick="filterProducts('grinders')">مطاحن القهوة</button>
    </div>

    <div class="products-grid" id="productsGrid">
      <!-- المنتجات يتم توليدها تلقائياً بالـ JavaScript -->
    </div>
  </div>

  <footer>
    <p>جميع الحقوق محفوظة &copy; Caffinity 2026</p>
  </footer>

  <script>
    const whatsappPhone = "201155378837";

    const products = [
      {
        id: "me2604",
        category: "machines",
        categoryName: "ماكينة محمولة",
        title: "icafilas Portable ME2604",
        desc: "ماكينة إسبريسو محمولة بقوة استخلاص 19 بار وبطارية قوية 7800mAh تدعم الكبسولات والبن المطحون.",
        price: "3,800 ج.م",
        image: "https://i.postimg.cc/pT7BtWX3/Product-One-Portrait-20260210-144119-0010.png"
      },
      {
        id: "me2406",
        category: "machines",
        categoryName: "ماكينة متعددة الاستخدام",
        title: "icafilas ME2406",
        desc: "نظام استخلاص ذكي متوافق مع كبسولات متعددة وبن مطحون مع تحكم حراري احترافي.",
        price: "4,500 ج.م",
        image: "https://i.postimg.cc/nrvrFxtK/2.jpg"
      },
      {
        id: "capadeli-rocket",
        category: "machines",
        categoryName: "ماكينة إسبريسو منزلية",
        title: "Capadeli Impetus Rocket",
        desc: "أداء إيطالي احترافي بقوة ضغط فائقة وثبات حراري لعشاق اللاتيه والإسبريسو المنزلي المكثف.",
        price: "8,500 ج.م",
        image: "https://i.postimg.cc/cHQWHgZK/Product-Two-Portrait-20260325-095416-0000-edit-179594770196383.png"
      },
      {
        id: "manual-grinder",
        category: "grinders",
        categoryName: "مطحنة يدوية",
        title: "iCafilas Exterior Manual Coffee Grinder",
        desc: "مطحنة يدوية بتصميم عصري مع تدريج خارجي دقيق وتروس ستانلس ستيل تضمن تجانس الطحنة بالكامل.",
        price: "1,950 ج.م",
        image: "https://i.postimg.cc/tC078zc0/Gemini-Generated-Image-3sl4xu3sl4xu3sl4.png"
      },
      {
        id: "travel-solo-grinder",
        category: "grinders",
        categoryName: "مطحنة كهربائية ومقطرة",
        title: "iCafilas Travel Solo Electronic Grinder Dripper",
        desc: "جهاز مدمج 2 في 1 يجمع بين المطحنة الإلكترونية المحمولة وقمع التقطير لتحضير قهوتك في أي مكان بسهولة.",
        price: "2,600 ج.م",
        image: "https://i.postimg.cc/hjy3kPgR/Whats-App-Image-2026-03-29-at-12-50-25-PM.jpg"
      }
    ];

    function renderProducts(items) {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      items.forEach(item => {
        const message = encodeURIComponent(`أهلاً كافينتي! مهتم بطلب منتج: ${item.title} (بسعر ${item.price})`);
        const waLink = `https://wa.me/${whatsappPhone}?text=${message}`;

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" class="product-image" onerror="this.src='https://placehold.co/600x400/181b22/c4975e?text=Caffinity+Coffee'">
          <div class="product-body">
            <span class="category-badge">${item.categoryName}</span>
            <h3 class="product-title">${item.title}</h3>
            <p class="product-desc">${item.desc}</p>
            <div class="product-price">${item.price}</div>
            <a href="${waLink}" target="_blank" class="btn-buy">
              طلب عبر واتساب 💬
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts(category) {
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      if (category === "all") {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    // التحميل المبدئي
    renderProducts(products);
  </script>
</body>
</html>
